plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def repoRoot = file("../..")
def genPyDir = file("$buildDir/generated/python_src")
def genAssetsDir = file("$buildDir/generated/assets_out")
def autoKeystore = file("$buildDir/sandaha-release.jks")
// Fixed release key (CI: decoded from the ANDROID_KEYSTORE_B64 secret). With it, every new APK
// installs over the previous one. Without it, a throwaway local key is generated (dev builds only).
def fixedKeystorePath = System.getenv("SANDAHA_KEYSTORE")
def fixedKeystorePassword = System.getenv("SANDAHA_KEYSTORE_PASSWORD")
def useFixedKeystore = fixedKeystorePath && fixedKeystorePassword && file(fixedKeystorePath).exists()
if (!useFixedKeystore && System.getenv("CI")) {
    throw new GradleException("CI build without the fixed signing key: set the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets")
}

tasks.register("syncSandahaAssets") {
    doLast {
        delete(genPyDir)
        delete(genAssetsDir)
        copy {
            from("$repoRoot/sandaha")
            into("$genPyDir/sandaha")
            include "**/*.py"
            exclude "train/**"
            exclude "server/training.py"
        }
        copy {
            from("$repoRoot/sandaha/web")
            into("$genAssetsDir/web")
            exclude "js/train.js"
        }
        copy {
            from("$repoRoot/models")
            into("$genAssetsDir/models")
            include "*.npz"
            include "*.json"
        }
        genAssetsDir.mkdirs()
        new File(genAssetsDir, "version.txt").text = android.defaultConfig.versionName + "-" + System.currentTimeMillis()
    }
}

tasks.register("ensureReleaseKeystore") {
    doLast {
        if (!useFixedKeystore && !autoKeystore.exists()) {
            autoKeystore.parentFile.mkdirs()
            def javaHome = System.getProperty("java.home")
            def keytoolBin = new File(javaHome, "bin/keytool" + (System.getProperty("os.name").toLowerCase().contains("win") ? ".exe" : ""))
            exec {
                commandLine(
                    keytoolBin.exists() ? keytoolBin.absolutePath : "keytool",
                    "-genkeypair", "-v",
                    "-keystore", autoKeystore.absolutePath,
                    "-alias", "sandaha",
                    "-keyalg", "RSA",
                    "-keysize", "2048",
                    "-validity", "10000",
                    "-storepass", "sandaha2026",
                    "-keypass", "sandaha2026",
                    "-dname", "CN=SanDaHa-Zero, OU=AI, O=SanDaHa, L=Changsha, S=Hunan, C=CN"
                )
            }
        }
    }
}

android {
    namespace 'com.sandaha.zero'
    compileSdk 34

    defaultConfig {
        applicationId "com.sandaha.zero"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "2.4.2"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            if (useFixedKeystore) {
                storeFile file(fixedKeystorePath)
                storeType "pkcs12"
                storePassword fixedKeystorePassword
                keyAlias "sandaha"
                keyPassword fixedKeystorePassword
            } else {
                storeFile autoKeystore
                storePassword "sandaha2026"
                keyAlias "sandaha"
                keyPassword "sandaha2026"
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [genAssetsDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.13"
        pip {
            install "chaquopy-libcxx>=180000"
            install "numpy"
            install "segno"
        }
        pyc {
            src false
        }
    }
    sourceSets {
        main {
            srcDir genPyDir
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preBuild" || task.name.contains("Python") || task.name.contains("Assets") || task.name.contains("ValidateSigning")) {
        if (task.name != "syncSandahaAssets" && task.name != "ensureReleaseKeystore") {
            task.dependsOn("syncSandahaAssets", "ensureReleaseKeystore")
        }
    }
}
