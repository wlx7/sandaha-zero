name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 (for Chaquopy 17 + 16KB page size build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore release signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sandaha-release.p12"
          echo "SANDAHA_KEYSTORE=$RUNNER_TEMP/sandaha-release.p12" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        env:
          SANDAHA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          which python3.13 && python3.13 --version
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk SanDaHa-Zero-Android.apk
          ls -lh SanDaHa-Zero-Android.apk
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs SanDaHa-Zero-Android.apk
          rm -f "$SANDAHA_KEYSTORE"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SanDaHa-Zero-Android-APK
          path: SanDaHa-Zero-Android.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & build EXE
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          python scripts/build_windows.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SanDaHa-Zero-Windows-EXE
          path: dist/SanDaHa-Zero-Windows-x64.exe
